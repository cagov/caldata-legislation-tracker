# Lakeflow Declarative Pipeline: the ingest -> transform -> publish (bronze ->
# silver -> gold) medallion flow. Serverless so there are no clusters to manage.
#
# Schema names are environment-scoped (per-developer under dev, canonical under
# prod) via resources/legislation.catalog.yml — see docs/architecture.md. Never
# hardcode "bronze"/"silver"/"gold" as a literal in a .sql file; reference the
# ${bronze_schema}/${gold_schema} configuration values below instead. Silver is
# the pipeline's default schema, so silver .sql files never need to qualify a
# table name at all.
#
# Source files are picked up by the globs below. At bootstrap there are no
# transform/publish SQL files yet, only placeholder READMEs.
resources:
  pipelines:
    legislation_pipeline:
      name: legislation_pipeline
      catalog: ${var.catalog}
      schema: ${resources.schemas.silver.name} # default schema for unqualified tables
      serverless: true
      channel: CURRENT
      # Exposed to SQL source files as ${catalog}/${bronze_schema}/etc, since
      # bundle variables and resource references aren't substituted into .sql
      # file contents directly (only into resource YAML).
      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${resources.schemas.bronze.name}
        gold_schema: ${resources.schemas.gold.name}
        parsed_volume: ${resources.volumes.parsed_raw.name}
      # Glob includes must be directory-recursive (`**`); a `*.sql` suffix filter is
      # not supported. Lakeflow loads .sql/.py source files and ignores others
      # (e.g. the placeholder README.md files).
      libraries:
        - glob:
            include: ../src/ingest/**
        - glob:
            include: ../src/transform/**
        - glob:
            include: ../src/publish/**
