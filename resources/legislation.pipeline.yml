# Lakeflow Declarative Pipeline: the ingest -> transform -> publish (bronze ->
# silver -> gold) medallion flow. Serverless so there are no clusters to manage.
#
# Source files are picked up by the globs below. Tables are written to the
# bronze/silver/gold schemas by fully qualifying their names in the SQL, e.g.
#   CREATE OR REFRESH STREAMING TABLE bronze.bill_raw ...
#   CREATE OR REFRESH MATERIALIZED VIEW silver.bill ...
# At bootstrap there are no SQL files yet, only placeholder READMEs.
resources:
  pipelines:
    legislation_pipeline:
      name: legislation_pipeline
      catalog: ${var.catalog}
      schema: silver # default schema for unqualified tables
      serverless: true
      channel: CURRENT
      # Which landed zips bronze unzips. Swap source_zip to a pubinfo_daily_<Day>.zip
      # for the nightly non-code refresh, or the weekly pubinfo_YYYY.zip for the full
      # refresh (see ca-leginfo-bulk-download.md §6). Consumed via spark.conf in
      # src/ingest/bronze/leginfo_bronze.py.
      configuration:
        leginfo.source_zip: /Volumes/${var.catalog}/bronze/raw/zips/pubinfo_2025.zip
        leginfo.loader_zip: /Volumes/${var.catalog}/bronze/raw/zips/pubinfo_load.zip
      # Glob includes must be directory-recursive (`**`); a `*.sql` suffix filter is
      # not supported. Lakeflow loads .sql/.py source files and ignores others
      # (e.g. the placeholder README.md files).
      #
      # Bronze source is scoped to `src/ingest/bronze/` so it excludes
      # `src/ingest/land_raw.py`: that landing script is a Job pre-task, not
      # pipeline source, and Lakeflow would otherwise import and execute it
      # (downloading ~1 GB) during graph analysis.
      libraries:
        - glob:
            include: ../src/ingest/bronze/**
        - glob:
            include: ../src/transform/**
        - glob:
            include: ../src/publish/**
